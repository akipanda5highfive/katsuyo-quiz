<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>韓国語 活用クイズ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
html{color-scheme:light}
body{margin:0}
/* Layout: 1 column, one question card at a time. Ink navy + vermilion from the book cover. */
:root {
  --bg: #f6f6f3;
  --surface: #ffffff;
  --fg: #16202e;
  --muted: #5d6877;
  --line: #d5d8dd;
  --ink: #1d3557;
  --ink-soft: #e3e9f2;
  --accent: #c8553d;
  --accent-fg: #ffffff;
  --ok: #1f7a4f;
  --ok-soft: #dff1e7;
  --irr-bg: #fde6d6; --irr-fg: #a3400c;
  --reg-bg: #e4edf8; --reg-fg: #1b4a7e;
  --drop-bg: #def2ed; --drop-fg: #14645a;
  --spec-bg: #ece4f7; --spec-fg: #5a2a8c;
  --font-jp: 'Zen Kaku Gothic New', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans CJK JP', sans-serif;
  --font-ko: 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans CJK KR', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1620; --surface: #172131; --fg: #e8edf4; --muted: #9aa6b6; --line: #2b384b;
    --ink: #9fbbe6; --ink-soft: #1f2e45; --accent: #e8765d; --accent-fg: #1a0e0a;
    --ok: #6fd1a0; --ok-soft: #173a2b;
    --irr-bg: #4a2a17; --irr-fg: #ffc9a3; --reg-bg: #1f3350; --reg-fg: #b6d3f5;
    --drop-bg: #16413b; --drop-fg: #9ee3d6; --spec-bg: #35254d; --spec-fg: #d6bff5;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1620; --surface: #172131; --fg: #e8edf4; --muted: #9aa6b6; --line: #2b384b;
  --ink: #9fbbe6; --ink-soft: #1f2e45; --accent: #e8765d; --accent-fg: #1a0e0a;
  --ok: #6fd1a0; --ok-soft: #173a2b;
  --irr-bg: #4a2a17; --irr-fg: #ffc9a3; --reg-bg: #1f3350; --reg-fg: #b6d3f5;
  --drop-bg: #16413b; --drop-fg: #9ee3d6; --spec-bg: #35254d; --spec-fg: #d6bff5;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-jp); font-size: 16px; line-height: 1.6;
  padding-block: 16px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.ko { font-family: var(--font-ko); }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-size: 1.25rem; margin: 0; font-weight: 700; color: var(--ink); letter-spacing: .02em; }
.stats { font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 16px 16px; display: flex; flex-direction: column; gap: 16px; }
.qhead { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: .78rem; color: var(--muted); }
.kind { padding: 1px 9px; border-radius: 99px; background: var(--ink-soft); color: var(--ink); font-weight: 700; }
.prompt-label { font-size: .85rem; color: var(--muted); margin: 0; }
.prompt { font-size: clamp(1.6rem, 7vw, 2.1rem); font-weight: 700; line-height: 1.35; margin: 0; overflow-wrap: anywhere; text-wrap: balance; }

.slots { display: flex; flex-direction: column; gap: 10px; }
.slot { border: 1.5px dashed var(--line); border-radius: 10px; padding: 10px 12px; display: flex; align-items: center; gap: 10px; min-height: 66px; }
.slot.filled { border-style: solid; border-color: var(--ink); background: var(--ink-soft); }
.slot .tag { flex: none; width: 4.6em; white-space: nowrap; font-size: .72rem; color: var(--muted); line-height: 1.3; }
.slot .body { flex: 1; min-width: 0; }
.slot .big { font-size: 1.55rem; font-weight: 500; line-height: 1.25; overflow-wrap: anywhere; }
.slot .sub { font-size: .8rem; color: var(--muted); }
.slot .blank { color: var(--line); font-size: 1.4rem; letter-spacing: .3em; }
.slot .hint { font-size: .85rem; color: var(--accent); font-weight: 700; }
.spk { flex: none; width: 46px; height: 46px; border-radius: 50%; border: 1.5px solid var(--ink); background: var(--surface); color: var(--ink); display: grid; place-items: center; }
.spk:active { background: var(--ink); color: var(--bg); }
.spk svg { width: 22px; height: 22px; }

.note { border-radius: 10px; padding: 10px 12px; background: var(--bg); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
.chip { align-self: flex-start; padding: 1px 10px; border-radius: 6px; font-size: .8rem; font-weight: 700; }
.chip.irr { background: var(--irr-bg); color: var(--irr-fg); }
.chip.reg { background: var(--reg-bg); color: var(--reg-fg); }
.chip.drop { background: var(--drop-bg); color: var(--drop-fg); }
.chip.spec { background: var(--spec-bg); color: var(--spec-fg); }
.note p { margin: 0; font-size: .85rem; line-height: 1.6; font-family: var(--font-ko), var(--font-jp); }

.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.btn { flex: 1 1 110px; min-height: 52px; border-radius: 12px; border: 1.5px solid var(--ink); background: var(--surface); color: var(--ink); font-weight: 700; padding: 8px 14px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
.btn.quiet { border-color: var(--line); color: var(--muted); font-weight: 500; }
.btn[disabled] { opacity: .45; cursor: default; }
:root[data-theme="dark"] .btn.ok { color: #06180f; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.ok { color: #06180f; } }

details.set { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 0 14px; }
details.set summary { cursor: pointer; padding: 12px 0; font-weight: 700; color: var(--ink); }
.set .grid { display: flex; flex-direction: column; gap: 12px; padding-bottom: 14px; }
.set fieldset { border: 0; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
.set legend { font-size: .8rem; color: var(--muted); padding: 0; margin-bottom: 4px; }
.set label { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; }
.set input[type=checkbox], .set input[type=radio] { width: 20px; height: 20px; accent-color: var(--accent); }
.set select { font: inherit; min-height: 40px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); padding: 4px 8px; }
.msg { font-size: .82rem; color: var(--irr-fg); background: var(--irr-bg); border-radius: 8px; padding: 8px 10px; margin: 0; }
.foot { font-size: .75rem; color: var(--muted); text-align: center; margin: 4px 0 0; }
@media (prefers-reduced-motion: no-preference) { .slot, .btn { transition: background-color .15s, border-color .15s; } }
</style>

</head>
<body>
<div class="wrap">
  <header>
    <h1>韓国語 活用クイズ</h1>
    <div class="stats" id="stats" aria-live="polite"></div>
  </header>

  <main class="card" id="card">
    <div class="qhead"><span class="kind" id="kind"></span><span id="qno"></span></div>
    <div>
      <p class="prompt-label">この日本語を、韓国語で言うと？</p>
      <p class="prompt" id="prompt"></p>
    </div>
    <div class="slots">
      <div class="slot" id="slot1">
        <div class="tag">原形<br>(辞書形)</div>
        <div class="body" id="body1"></div>
        <button class="spk" id="spk1" aria-label="原形の音を聞く" hidden></button>
      </div>
      <div class="slot" id="slot2">
        <div class="tag">活用形</div>
        <div class="body" id="body2"></div>
        <button class="spk" id="spk2" aria-label="活用形の音を聞く" hidden></button>
      </div>
    </div>
    <div class="note" id="note" hidden></div>
    <p class="msg" id="novoice" hidden>この端末では韓国語の音声が見つかりませんでした。端末の設定で韓国語の音声を追加すると、音が出ます。</p>
    <div class="actions" id="actions"></div>
  </main>

  <details class="set">
    <summary>出題をえらぶ</summary>
    <div class="grid">
      <fieldset><legend>品詞</legend>
        <label><input type="checkbox" id="fV" checked> 動詞</label>
        <label><input type="checkbox" id="fA" checked> 形容詞</label>
      </fieldset>
      <fieldset><legend>活用のタイプ</legend>
        <label><input type="radio" name="ftype" value="all" checked> すべて</label>
        <label><input type="radio" name="ftype" value="irr"> 変則・脱落・特殊だけ</label>
        <label><input type="radio" name="ftype" value="reg"> 規則だけ</label>
      </fieldset>
      <fieldset><legend>苦手</legend>
        <label><input type="checkbox" id="fWeak"> 「もう一度」にした問題だけ</label>
      </fieldset>
      <fieldset><legend>音声</legend>
        <label><input type="checkbox" id="fAuto" checked> 答えを見たとき自動で読む</label>
        <label for="fRate">速さ</label>
        <select id="fRate"><option value="0.7">ゆっくり</option><option value="0.85" selected>ふつう</option><option value="1">はやい</option></select>
      </fieldset>
      <fieldset><legend>記録</legend>
        <button class="btn quiet" id="reset" type="button">できた・もう一度の記録を消す</button>
        <span id="resetmsg" class="stats"></span>
      </fieldset>
    </div>
  </details>
  <p class="foot">「韓国語 基本用言 活用ブック」（動詞98・形容詞50）の活用形から出題しています。</p>
</div>

};

const Q = [];
DATA.forEach(e => e.r.forEach((r, i) => Q.push({ id: e.t + e.n + ':' + i, e, lab: r[0], ko: r[1], jp: r[2] })));

const $ = id => document.getElementById(id);
let cur = null, revealed = false, hint = 0, showBase = false, last = null, asked = 0, good = 0;

function pool() {
  const v = $('fV').checked, a = $('fA').checked;
  const ty = document.querySelector('input[name=ftype]:checked').value;
  const weak = $('fWeak').checked;
  return Q.filter(q => {
    if (q.e.t === 'v' && !v) return false;
    if (q.e.t === 'a' && !a) return false;
    if (ty === 'irr' && q.e.c === 'reg') return false;
    if (ty === 'reg' && q.e.c !== 'reg') return false;
    if (weak && !(prog[q.id] && prog[q.id].l === 'ng')) return false;
    return true;
  });
}
function weight(q) {
  const p = prog[q.id];
  if (!p) return 3;
  if (p.l === 'ng') return 6;
  return p.ok >= 2 ? 1 : 2;
}
function pick() {
  const P = pool();
  if (!P.length) return null;
  const C = P.length > 1 ? P.filter(q => q.id !== last) : P;
  let sum = 0; C.forEach(q => sum += weight(q));
  let r = Math.random() * sum;
  for (const q of C) { r -= weight(q); if (r <= 0) return q; }
  return C[C.length - 1];
}

/* ---------- 音声 ---------- */
let voice = null;
function loadVoice() {
  if (!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices();
  const ko = vs.filter(v => /^ko/i.test(v.lang));
  voice = ko.find(v => /natural|online/i.test(v.name)) || ko.find(v => /local|heami|sunhi|yuna/i.test(v.name)) || ko[0] || null;
}
if ('speechSynthesis' in window) {
  loadVoice();
  speechSynthesis.addEventListener && speechSynthesis.addEventListener('voiceschanged', loadVoice);
}
const clean = s => s.split('(')[0].replace(/[~〜\-]/g, '').trim();
function say(text, after) {
  if (!('speechSynthesis' in window)) { $('novoice').hidden = false; return; }
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(clean(text));
    u.lang = 'ko-KR';
    if (voice) u.voice = voice;
    u.rate = parseFloat($('fRate').value) || .85;
    if (after) u.onend = after;
    speechSynthesis.speak(u);
  } catch (e) {}
  if (!voice) loadVoice();
  $('novoice').hidden = !!voice;
}

function reveal() {

}
function grade(ok) {
  const p = prog[cur.id] || { ok: 0, ng: 0, l: '' };
  if (ok) { p.ok++; p.l = 'ok'; good++; } else { p.ng++; p.l = 'ng'; }
  prog[cur.id] = p; saveProg(); asked++;

}

  try { speechSynthesis.cancel(); } catch (e) {}
